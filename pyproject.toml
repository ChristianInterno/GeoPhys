[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "geophys"
version = "1.0.0"
description = "GeoPhys: the geometry of physical plausibility"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Christian Interno"}]
dependencies = [
    "numpy>=1.24,<2.0",
    "pandas>=2.0",
    "torch>=2.1",
    "torchvision>=0.16",
    "transformers>=4.40",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "tqdm>=4.65",
]

[project.urls]
Homepage = "https://christianinterno.github.io/GeoPhys/"
Paper = "https://arxiv.org/abs/2606.20707"
Code = "https://github.com/ChristianInterno/GeoPhys"

[tool.setuptools]
packages = ["geophys"]
